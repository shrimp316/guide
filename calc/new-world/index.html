<script type="module">
import { loadInputs, loadText, loadSheets, runChunked } from './engine.js';
import { searchMinGems } from './search.js';
import { cachedRun } from './cache.js';

const $ = (id) => document.getElementById(id);
const root = document.documentElement;
const THEMES = [[90001, '불', 'fire', '#FF6A2B'], [90002, '얼음', 'ice', '#3CC8F0'], [90003, '마법', 'magic', '#A57BFF']];
const DIFFS = [[0, '보통', 10], [1, '어려움', 15], [2, '극한', 20]];
const MS = [['ms_ads', '광고'], ['ms_booster', '부스터'], ['ms_mission', '미션'], ['ms_power', '파워'], ['ms_soul', '영혼'], ['ms_science', '과학'], ['ms_quantum', '양자'], ['nw_pass', '패스']];
const S = { theme: 90001, diff: 0, lv: {}, ms: Object.fromEntries(MS.map(([id]) => [id, true])), pass: 1, pdays: new Set(), opt: false, ads: false, ltd: true };
let inputs, text = {}, M = {};
const img = (src, cls = '') => (src ? `<img class="${cls}" src="${src}" alt="" onerror="this.remove()">` : '');
const nDays = () => Math.min(14, Math.max(1, +$('days').value || 6));
const curIcon = (id) => {
  const m = /card_frame_(\d)/.exec(id);
  if (m) return M.currency?.[['card_frame_normal', 'card_frame_epic', 'card_frame_legendary', 'card_frame_golden'][m[1] - 1]];
  if (/world_crystal/.test(id)) return M.currency?.world_crystal;
  if (/time|leap/.test(id)) return M.currency?.time_leap;
  return M.memberships?.[id] ?? M.currency?.gem;
};

const won = (n) => Math.round(n).toLocaleString('ko-KR');
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const dur = (h) => { const t = Math.round(h * 60), d = Math.floor(t / 1440), hh = Math.floor((t % 1440) / 60), m = t % 60; return d ? `${d}일 ${hh}시간` : hh ? `${hh}시간${m ? ' ' + m + '분' : ''}` : `${m}분`; };
const durS = (h) => { const t = Math.round(h * 60), d = Math.floor(t / 1440), hh = Math.floor((t % 1440) / 60); return d ? `${d}일 ${hh}h` : hh ? `${hh}h` : `${t % 60}분`; };
const fmtDate = (d) => d.toLocaleString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' });
const tab = () => (location.hash === '#gems' ? 'gems' : 'sim');

// ---------- 입력 ----------
function renderTheme() {
  $('theme').innerHTML = THEMES.map(([id, n, k, c]) => `<button class="tile" style="--c:${c}" data-id="${id}" aria-pressed="${id === S.theme}">${M.extra?.['theme_top_' + k] ? `<span class="top" style="background-image:url(${M.extra['theme_top_' + k]})"></span>` : ''}${img(M.themes?.[id])}<span class="nm disp">${n}</span></button>`).join('');

function makePool(n) {

}

  $('gBody').hidden = false; $('gdet').hidden = false;

  $('gk').innerHTML = optInfo ? '<tr><th>1일권</th><th>총 다이아</th><th>시간</th></tr>' + optInfo.rows.map(({ k, res: rr }) => { const t = optInfo.total(rr); return `<tr><td>${k}일${k === optInfo.k ? ' ★' : ''}</td><td>${t === Infinity ? '불가' : won(t)}</td><td>${t === Infinity ? '' : dur(rr.best.r.elapsedHours)}</td></tr>`; }).join('') : '';
  $('gatt').innerHTML = '<tr><th>예산</th><th>결과</th><th>시간 · 랭크</th></tr>' + att.map(({ budget, r }) =>
    `<tr><td>${won(budget)}</td><td class="${r.reached ? 'ok' : 'bad'}">${r.reached ? '달성' : '미달'}</td><td>${r.reached ? dur(r.elapsedHours) + ' · ' : ''}${r.finalRank}</td></tr>`).join('');
  $('gchips').innerHTML = '';
  if (res.status === 'unreachable') {
    h.innerHTML = gcard('bad', gnum(`${res.cap >= 10000 ? res.cap / 10000 + '만' : won(res.cap)} 다이아로도 불가`, 't'), `${o.seasonDays}일 내 랭크 ${o.rankMax} 불가 · 최고 랭크 ${res.maxRank}`); return;
  }
  const { budget, r } = res.best, pg = r.passGems || 0, tot = r.gemsSpent + pg;
  const end = o.startDate ? ` <small>(${fmtDate(new Date(o.startDate.getTime() + r.elapsedHours * 3600e3))})</small>` : '';
  const line = `이 조건이면 <b>${dur(r.elapsedHours)}</b>에 랭크 ${o.rankMax} 달성${end}${res.status === 'free' ? '' : ` <small>· 예산 ${won(budget)}</small>`}`;
  h.innerHTML = gcard('', tot ? gnum(won(tot)) + gunit('다이아') : gnum('다이아 필요 없음', 't'), line);
  $('gchips').innerHTML = (pg ? passChip(pg / 900) : '') + gemItems(r).map((x) => itemChip(x.icon, x.name, x.qty, x.gems)).join('');
}

// ---------- 시작 ----------
function route() {
  const t = tab(); document.querySelector('main').dataset.tab = t;
  for (const k of ['sim', 'gems']) { $('t-' + k).setAttribute('aria-selected', k === t); $('t-' + k).tabIndex = k === t ? 0 : -1; }
  $('tabs').dataset.tab = t;
  renderAdv(); renderBar(); renderDays();
}
addEventListener('hashchange', route);
$('tabs').addEventListener('keydown', (e) => { if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return; const t = tab() === 'sim' ? 'gems' : 'sim'; location.hash = '#' + t; $('t-' + t).focus(); e.preventDefault(); });
inputs = await loadInputs(); text = await loadText();
try { const sh = await loadSheets(); PR = { prod: new Map(sh.Product.map((p) => [p.ProductId, p])), rew: new Map(sh.Reward.map((x) => [x.RewardId, x])) }; } catch { PR = null; }
try { M = await (await fetch('img/manifest.json')).json(); } catch { M = {}; }
renderTheme(); renderDiff(); renderMs(); renderGem(); route();
if (tab() === 'sim') startSim();
</script>
