<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>벽돌주식회사 통합사이트</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1D9E75">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="벽돌가이드">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/index.css">
</head>
<body>

<header class="mobile-header">
  <button class="hamburger" id="menuBtn" type="button" aria-label="메뉴 열기" aria-controls="sidebar" aria-expanded="false">☰</button>
  <span class="mobile-title" id="mobileTitle">벽돌주식회사</span>
</header>
<div class="overlay" id="overlay"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="site-logo">
        <button class="logo-icon" type="button" data-page="home" aria-label="홈으로 이동">🧱</button>
        <div>
          <div class="site-name"><button class="site-home-btn" type="button" data-page="home">벽돌주식회사</button></div>
          <div class="site-sub">통합 정보사이트</div>
        </div>
      </div>
      <div class="auth-area">
        <div class="user-info" id="userInfo"></div>
        <button class="auth-btn" id="authBtn">Google 로그인</button>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-group">
        <button class="nav-item" data-page="home"><span class="nav-icon">🏠</span> 홈</button>
        <button class="nav-item" data-page="board-suggest"><span class="nav-icon">📬</span> 건의게시판</button>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-group">
        <div class="nav-group-label">가이드</div>
        <button class="nav-item" data-page="guide-pre-god"><span class="nav-icon">📖</span> 신 이전</button>
        <button class="nav-item" data-page="guide-god1-4"><span class="nav-icon">📖</span> 신1 ~ 신4</button>
        <button class="nav-item" data-page="guide-god4-7"><span class="nav-icon">📖</span> 신4 ~ 신7</button>
        <button class="nav-item" data-page="guide-god7-11"><span class="nav-icon">📖</span> 신7 ~ 신11</button>
        <button class="nav-item" data-page="guide-god11-15"><span class="nav-icon">📖</span> 신11 ~ 신15</button>
        <button class="nav-item" data-page="guide-super1-4"><span class="nav-icon">📖</span> 초월신1 ~ 4</button>
        <button class="nav-item" data-page="guide-super4"><span class="nav-icon">📖</span> 초월신4 이후</button>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-group">
        <div class="nav-group-label">공략</div>
        <button class="nav-item" data-page="guide-dive"><span class="nav-icon">🤿</span> 다이브</button>
        <button class="nav-item" data-page="guide-beast-guide"><span class="nav-icon">🐉</span> 신수</button>
        <button class="nav-item" data-page="guide-dimension-guide"><span class="nav-icon">🔭</span> 차원탐사</button>
        <button class="nav-item" data-page="guide-dimension-train"><span class="nav-icon">🚂</span> 차원열차</button>
        <button class="nav-item" data-page="guide-amounts"><span class="nav-icon">📖</span> 수치 정보</button>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-group">
        <div class="nav-group-label">계산기 / 도구</div>
        <button class="nav-item" data-page="calc-ascension"><span class="nav-icon">⚡</span> 득도·승천</button>
        <button class="nav-item" data-page="calc-forge"><span class="nav-icon">🔨</span> 제련</button>
        <button class="nav-item" data-page="calc-beast-cal"><span class="nav-icon">🧮</span> 신수 계산기</button>
        <button class="nav-item" data-page="calc-dimension-ev"><span class="nav-icon">🎲</span> 차원탐사 기댓값</button>
        <button class="nav-item" data-page="tool-path"><span class="nav-icon">🗺️</span> 진리의 길</button>
        <button class="nav-item" data-page="tool-tree"><span class="nav-icon">🌳</span> 진리의 나무</button>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-group">
        <button class="nav-item" data-external-url="https://www.seasoninggames.com/ko/blog">
          <span class="nav-icon">🌐</span> 공식 홈페이지 <span class="nav-ext">↗</span>
        </button>
      </div>
    </nav>
  </aside>

  <main class="main">

    <!-- 홈 대시보드 -->
    <div class="view active" id="view-home">
      <section class="home-hero" aria-labelledby="homeTitle">
        <div class="hero-bricks" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <div class="hero-content">
          <p class="hero-eyebrow">BRICK INC. GUIDE</p>
          <h1 id="homeTitle">벽돌주식회사 게임 가이드</h1>
          <p class="hero-desc">필요한 공략을 찾고, 자주 쓰는 계산기를 바로 실행하세요.</p>
          <div class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <label class="sr-only" for="searchInput">가이드 및 도구 통합 검색</label>
            <input class="search-input" type="search" placeholder="가이드, 공략, 계산기 검색" id="searchInput" autocomplete="off" aria-controls="searchResults" aria-expanded="false">
          </div>
        </div>
      </section>

      <section class="search-results" id="searchResults" aria-labelledby="searchResultsTitle" hidden>
        <div class="section-heading">
          <h2 id="searchResultsTitle">검색 결과</h2>
          <span class="section-kicker" id="searchResultCount" aria-live="polite"></span>
        </div>
        <div class="search-result-list" id="searchResultList"></div>
      </section>

      <section class="dashboard-section" aria-labelledby="quickTitle">
        <div class="section-heading">
          <div><p class="section-kicker">QUICK ACCESS</p><h2 id="quickTitle">빠른 계산</h2></div>
        </div>
        <div class="quick-grid">
          <button class="quick-action" type="button" data-page="calc-ascension"><span class="quick-icon quick-icon-gold" aria-hidden="true">◆</span><span><strong>득도·승천</strong><small>소모량 계산</small></span><span class="quick-arrow" aria-hidden="true">→</span></button>
          <button class="quick-action" type="button" data-page="calc-dimension-ev"><span class="quick-icon quick-icon-violet" aria-hidden="true">◈</span><span><strong>차원탐사</strong><small>기대값 계산</small></span><span class="quick-arrow" aria-hidden="true">→</span></button>
          <button class="quick-action" type="button" data-page="calc-forge"><span class="quick-icon quick-icon-red" aria-hidden="true">⚒</span><span><strong>제련</strong><small>강화 비용 계산</small></span><span class="quick-arrow" aria-hidden="true">→</span></button>
          <button class="quick-action" type="button" data-page="calc-beast-cal"><span class="quick-icon quick-icon-green" aria-hidden="true">♞</span><span><strong>신수</strong><small>각성·육성 계산</small></span><span class="quick-arrow" aria-hidden="true">→</span></button>
          <button class="quick-action" type="button" data-page="tool-path"><span class="quick-icon quick-icon-blue" aria-hidden="true">⌁</span><span><strong>진리의 길</strong><small>최적 경로 찾기</small></span><span class="quick-arrow" aria-hidden="true">→</span></button>
          <button class="quick-action" type="button" data-page="tool-tree"><span class="quick-icon quick-icon-teal" aria-hidden="true">♧</span><span><strong>진리의 나무</strong><small>세팅과 누적 효과</small></span><span class="quick-arrow" aria-hidden="true">→</span></button>
        </div>
      </section>

      <section class="dashboard-section" aria-labelledby="latestPostsTitle">
        <div class="section-heading">
          <div><p class="section-kicker">COMMUNITY</p><h2 id="latestPostsTitle">최신 글</h2></div>
        </div>
        <div class="latest-posts-preview" id="homeBoardPreview" aria-live="polite" aria-busy="true">
          <p class="dashboard-status">최신 글을 불러오는 중입니다.</p>
        </div>
      </section>
    </div>

    <!-- 가이드/게시판 뷰 -->
    <div class="view" id="view-guide">
      <div class="guide-header">
        <div>
          <h2 class="guide-title" id="guideTitle"></h2>
          <div class="guide-desc" id="guideDesc"></div>
        </div>
      </div>
      <div id="boardList"></div>
    </div>

    <!-- iframe 뷰 -->
    <div class="view-iframe" id="view-iframe">
      <div class="iframe-topbar">
        <button class="back-btn" data-page="home">← 홈으로</button>
        <span class="iframe-title" id="iframeTitle"></span>
      </div>
      <iframe class="content-iframe" id="contentIframe" src="" title="콘텐츠" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>

  </main>
</div>

<!-- 글 상세 모달 -->
<div class="modal-overlay" id="postModal" role="dialog" aria-modal="true" aria-labelledby="postModalTitle" aria-hidden="true">
  <div class="modal" tabindex="-1">
    <div class="modal-header">
      <h2 class="modal-title" id="postModalTitle"></h2>
      <button class="modal-close" data-board-action="close-post" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body">
      <div class="post-detail-meta" id="postModalMeta"></div>
      <div class="post-detail-body" id="postModalBody"></div>
      <div class="post-actions" id="postModalActions"></div>
    </div>
  </div>
</div>

<!-- 글쓰기/수정 모달 -->
<div class="modal-overlay" id="writeModal" role="dialog" aria-modal="true" aria-labelledby="writeModalTitle" aria-hidden="true">
  <div class="modal" tabindex="-1">
    <div class="modal-header">
      <h2 class="modal-title" id="writeModalTitle">글 작성</h2>
      <button class="modal-close" data-board-action="close-write" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="writePostId">
      <input type="hidden" id="writeCategory">
      <div class="field-row" id="writeNicknameRow">
        <div class="field">
          <label for="writeNickname">닉네임</label>
          <input type="text" id="writeNickname" placeholder="표시될 이름">
        </div>
        <div class="field" id="writePwRow">
          <label for="writePassword">비밀번호 <span class="field-label-note">(수정·삭제용)</span></label>
          <input type="password" id="writePassword" placeholder="나중에 수정/삭제 시 필요">
        </div>
      </div>
      <div class="field">
        <label for="writeTitleInput">제목</label>
        <input type="text" id="writeTitleInput" placeholder="글 제목을 입력하세요">
      </div>
      <div class="field">
        <label for="imageUpload">이미지 업로드</label>
        <div class="upload-row">
          <input class="image-upload-input" type="file" id="imageUpload" accept="image/*" multiple>
          <button class="upload-btn" type="button" data-board-action="upload">업로드</button>
        </div>
        <div class="field-hint">업로드하면 본문에 자동 삽입돼요.</div>
      </div>
      <div class="field">
        <div class="field-label" id="writeBodyLabel">본문</div>
        <div id="quillEditor"></div>
        <div class="field-hint">툴바로 서식 적용 · 이미지는 위 업로드 버튼 사용</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" type="button" data-board-action="close-write">취소</button>
      <button class="btn-submit" type="button" data-board-action="submit">게시하기</button>
    </div>
  </div>
</div>

<div class="inapp-banner" id="inappBanner">
  카카오톡 인앱 브라우저에서는 Google 로그인이 지원되지 않아요.<br>
  로그인 없이도 글 작성은 가능해요 😊<br>
  <button class="inapp-banner-btn" data-open-external>외부 브라우저로 열기</button>
  <button class="inapp-banner-btn inapp-banner-close" data-inapp-close>닫기</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
