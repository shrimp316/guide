<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>벽돌주식회사 결제 필터 & 합계 계산</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      color: var(--text-primary);
    }
    .app-header { width: 100%; margin: 0 auto 24px; }
    h2 { margin-bottom: 15px; }
    p { margin-bottom: 10px; text-align: center; line-height: 1.4; }
    .instructions { max-width: 640px; line-height: 1.7; margin: 0 0 14px; padding-left: 24px; }
    .privacy-note { font-size: 13px; color: var(--text-secondary); }
    .file-label { font-weight: 600; margin-top: 12px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    input[type="file"] {
      margin: 10px 0;
      padding: 6px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-primary);
    }
    button {
      background: var(--brand-700);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      margin: 5px;
      transition: background 0.2s;
    }
    button:hover { background: var(--brand-800); }
    .result {
      margin-top: 25px;
      font-size: 17px;
      font-weight: 600;
      text-align: center;
    }
    /* 보조 작업 버튼 */
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 28px;
      color: var(--brand-700);
      transition: color 0.25s, transform 0.2s;
    }
    .icon-btn:hover {
      color: var(--brand-800);
      transform: scale(1.2);
    }
    .icon-btn:disabled {
      color: var(--text-tertiary);
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1><span class="header-icon" aria-hidden="true">💳</span> 벽돌주식회사 결제 합계 계산</h1>
  </header>
  <ol class="instructions">
    <li>Google Takeout에서 로그인한 뒤 Google Pay만 선택해 CSV를 내보냅니다.</li>
    <li>아래에서 CSV 파일을 선택하고 <strong>합계 계산</strong>을 누릅니다.</li>
    <li>‘설명’에 ‘벽돌주식회사’가 포함되고 ‘상태’가 ‘완료’인 거래의 합계와 필터 CSV를 확인합니다.</li>
  </ol>
  <p class="privacy-note">Takeout 링크는 편의를 위해 제공되며 이 페이지는 선택한 파일을 서버로 전송하거나 개인정보를 수집하지 않습니다.</p>

  <label class="file-label" for="fileInput">Google Pay 결제 내역 CSV</label>
  <input type="file" id="fileInput" accept=".csv">
  <div class="actions">
    <button type="button" onclick="processCSV()">합계 계산</button>
    <button type="button" onclick="openLink()">🌐 Google Takeout 열기</button>
    <button type="button" id="downloadFilteredButton" onclick="downloadFiltered()" disabled>필터 결과 CSV 다운로드</button>
  </div>

  <div class="result" id="output" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
function openLink() {
const url = 'https://takeout.google.com/settings/takeout';
window.open(url, '_blank');
}
</script>

  <script>
    let filteredRows = [];

    // 금액 추출 함수
    function extractNumber(str) {
      if (!str) return 0;
      const clean = str.replace(/[^\d.-]/g, "");
      const num = parseFloat(clean);
      return isNaN(num) ? 0 : num;
    }

    // CSV 한 줄 파싱 함수 (따옴표 대응)
    function parseCSVLine(line) {
      const result = [];
      let current = "";
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = "";
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result;
    }

    // CSV 처리 함수
    function processCSV() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) {
        document.getElementById('output').textContent = "⚠️ CSV 파일을 선택하세요.";
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result.replace(/\r/g, '');
        const rows = text.split('\n').filter(r => r.trim() !== "");
        let total = 0;
        filteredRows = [];

        const header = parseCSVLine(rows[0]);
        const descIndex = header.findIndex(c => c.includes("설명"));
        const stateIndex = header.findIndex(c => c.includes("상태"));
        const amountIndex = header.findIndex(c => c.includes("금액"));
        filteredRows.push(rows[0]); // 헤더 추가

        for (let i = 1; i < rows.length; i++) {
          const cols = parseCSVLine(rows[i]);
          const desc = cols[descIndex] || "";
          const state = cols[stateIndex] || "";
          const amount = cols[amountIndex] || "";
          // 표기 차이(벽돌주식회사/벽돌 주식회사)를 모두 허용한다.
          const normalizedDesc = desc.replace(/\s+/g, '');
          const normalizedPattern = "벽돌주식회사";

          if (normalizedDesc.includes(normalizedPattern) && state.includes("완료")) {
            filteredRows.push(rows[i]);
            total += extractNumber(amount);
          }
        }

        document.getElementById('output').innerHTML =
          total > 0
            ? `🧱 '벽돌주식회사' + '완료' 조건 일치 거래 ${filteredRows.length - 1}건<br>총합: <strong>${total.toLocaleString()}원</strong>`
            : "⚠️ '벽돌주식회사' + '완료' 조건에 해당하는 내역이 없습니다.";

        // CSV 다운로드 아이콘 활성화
        const downloadBtn = document.getElementById('downloadFilteredButton');
        downloadBtn.disabled = filteredRows.length <= 1;
      };

      reader.readAsText(file, 'UTF-8');
    }

    // CSV 다운로드 함수
    function downloadFiltered() {
      if (filteredRows.length <= 1) {
        alert("다운로드할 데이터가 없습니다!");
        return;
      }

      const csvContent = filteredRows.join("\n");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "filtered_벽돌주식회사_완료.csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>


</body>
</html>
